<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Starting Lineup</title>
    <meta name="description" content="Starting Lineup">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <h1>Starting Lineup</h1>
    <fieldset>
      <legend>Status:</legend>
      <div>
        <input type="radio" name="status" value="Draft">
        <label>Draft</label>

        <input type="radio" name="status" value="Final" checked>
        <label>Final</label>
      </div>
    </fieldset>
    <p>Date:
      <select name="gameDate" id="date-select">
        <option value="March 20">March 20</option>
        <option value="March 24">March 24</option>
        <option value="April 2">April 2</option>
        <option value="April 6">April 6</option>
        <option value="April 13">April 13</option>
      </select>
    </p>
    <fieldset>
      <legend>Players:</legend>
      <div>
        <input type="checkbox" name="Aarav Agarwak" >
        <label>Aarav Agarwak</label>
      </div>
      <div>
        <input type="checkbox" name="Ava Johnson" >
        <label>Ava Johnson</label>
      </div>
      <div>
        <input type="checkbox" name="Julio Ortiz" >
        <label>Julio Ortiz</label>
      </div>
      <div>
        <input type="checkbox" name="Liam Rubio" >
        <label>Liam Rubio</label>
      </div>
      <div>
        <input type="checkbox" name="Emma Witherspoon" >
        <label>Emma Witherspoon</label>
      </div>
    </fieldset>
    <p>
      <button type="submit" id="submit">Submit</button>
    </p>
    <p id="output"></p>
  </body>
</html>
