<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Starting Lineup</title>
    <meta name="description" content="Starting Lineup">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <h1>Starting Lineup</h1>
    <fieldset>
      <legend>Status:</legend>
      <div>
        <input type="radio" name="status" id="draft" value="draft">
        <label>Draft</label>

        <input type="radio" name="status" id="final" value="final" checked>
        <label>Final</label>
      </div>
    </fieldset>
    <p>Date:
      <select name="gameDate" id="date-select">
        <option value="march20">March 20</option>
        <option value="march24">March 24</option>
        <option value="april02">April 2</option>
        <option value="april06">April 6</option>
        <option value="april13">April 13</option>
      </select>
    </p>
    <fieldset>
      <legend>Players:</legend>
      <div>
        <input type="checkbox" name="aarav" >
        <label>Aarav Agarwak</label>
      </div>
      <div>
        <input type="checkbox" name="ava" >
        <label>Ava Johnson</label>
      </div>
      <div>
        <input type="checkbox" name="julio" >
        <label>Julio Ortiz</label>
      </div>
      <div>
        <input type="checkbox" name="liam" >
        <label>Liam Rubio</label>
      </div>
      <div>
        <input type="checkbox" name="emma" >
        <label>Emma Witherspoon</label>
      </div>
    </fieldset>
    <p>
      <button type="submit" id="submit">Submit</button>
    </p>
  </body>
</html>
